<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samrudhi Control Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314301f'/%3E%3Cpath d='M16 8 25 23H7Z' fill='none' stroke='%232ED573' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Control Room navigation"></aside>
  <main class="main" id="main" tabindex="-1"></main>
  <aside class="rightpanel" id="rightpanel" aria-label="Agents on this project" hidden></aside>
</div>

<dialog id="login" aria-labelledby="login-title">
  <form id="login-form" method="dialog">
    <h2 id="login-title">Sign in</h2>
    <p class="muted small">Only a signed-in human can create projects, start them and make approval decisions.
      Human accounts are defined in <code>backend/core/auth.py</code>.</p>
    <div class="field"><label for="login-user">Username</label>
      <input id="login-user" name="username" autocomplete="username" required></div>
    <div class="field"><label for="login-pass">Password</label>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required></div>
    <p class="form-error" id="login-error" role="alert"></p>
    <div class="row end">
      <button type="button" class="btn btn-ghost" id="login-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/app.js"></script>
</body>
</html>
